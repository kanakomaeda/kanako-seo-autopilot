name: Verify app

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, 'security/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Run audit tests
        run: npm test
      - name: Run lint
        run: npm run lint
      - name: Run production build
        run: npm run build
